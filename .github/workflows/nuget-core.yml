name: Publish Core NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOTNET_VERSION: '10.0.x'
      PROJECT_PATH: 'src/TerribleSettingsAuditor/TerribleSettingsAuditor.csproj'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore $PROJECT_PATH

      - name: Build
        run: dotnet build $PROJECT_PATH --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Set CI version
        run: echo "PACKAGE_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Pack
        run: dotnet pack $PROJECT_PATH --configuration Release --no-build --output ./artifacts -p:PackageVersion=$PACKAGE_VERSION

      - name: Publish to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
